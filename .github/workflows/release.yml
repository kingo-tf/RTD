name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The compiler and all includes come from the newest release of this SourceMod
  # fork, so the plugin is built against the same build the servers run.
  SM_REPO: kingo-tf/sourcemod

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          version=$(grep -m1 '#define PLUGIN_VERSION' scripting/rtd.sp | cut -d '"' -f2)
          if [ -z "$version" ]; then
            echo "Could not read PLUGIN_VERSION from scripting/rtd.sp" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download SourceMod fork build
        id: sourcemod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest release that already has a Linux package. Builds from master
          # are prereleases, and a release exists before its Linux package is
          # uploaded, so "latest release" is not enough.
          asset=$(gh api "repos/$SM_REPO/releases?per_page=20" --jq \
            '[.[] | . as $r | .assets[] | select(.name | endswith("-linux.tar.gz")) | {tag: $r.tag_name, url: .browser_download_url}][0]')
          if [ -z "$asset" ] || [ "$asset" = "null" ]; then
            echo "No Linux package found in the releases of $SM_REPO" >&2
            exit 1
          fi
          tag=$(jq -r .tag <<< "$asset")
          url=$(jq -r .url <<< "$asset")
          echo "Using $SM_REPO $tag"
          mkdir -p "$RUNNER_TEMP/sourcemod"
          curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/sourcemod" addons/sourcemod/scripting
          scripting="$RUNNER_TEMP/sourcemod/addons/sourcemod/scripting"
          if [ ! -f "$scripting/include/tf2r_attributes.inc" ]; then
            echo "$SM_REPO $tag has no tf2r_attributes.inc" >&2
            exit 1
          fi
          echo "SM_SCRIPTING=$scripting" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compile
        working-directory: scripting
        run: |
          spcomp="$SM_SCRIPTING/spcomp64"
          [ -x "$spcomp" ] || spcomp="$SM_SCRIPTING/spcomp"
          mkdir -p "$RUNNER_TEMP/build"
          "$spcomp" rtd.sp \
            -i "$SM_SCRIPTING/include" \
            -i include \
            -o "$RUNNER_TEMP/build/rtd.smx"
          test -s "$RUNNER_TEMP/build/rtd.smx"

      - name: Package
        id: package
        run: |
          name="rtd-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha }}"
          pkg="$RUNNER_TEMP/package"
          mkdir -p "$pkg/plugins" "$pkg/scripting/include"
          cp "$RUNNER_TEMP/build/rtd.smx" "$pkg/plugins/"
          cp -r configs translations "$pkg/"
          cp scripting/rtd.sp "$pkg/scripting/"
          cp -r scripting/rtd "$pkg/scripting/"
          cp scripting/include/rtd2.inc "$pkg/scripting/include/"
          (cd "$pkg" && zip -qr "$RUNNER_TEMP/$name.zip" .)
          echo "zip=$RUNNER_TEMP/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.zip }}" \
            "$RUNNER_TEMP/build/rtd.smx" \
            --target "$GITHUB_SHA" \
            --title "RTD ${{ steps.version.outputs.version }} (build $GITHUB_RUN_NUMBER, ${{ steps.version.outputs.sha }})" \
            --notes "Built with ${SM_REPO} ${{ steps.sourcemod.outputs.tag }}." \
            --generate-notes
